<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Flight Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #00ff66;
      font-family: 'VT323', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* LED Matrix Outer Frame */
    .led-board {
      background: #000000;
      border: 4px solid #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0,0,0,0.9);
      position: relative;
    }

    /* Pixel Grid Effect */
    .led-board::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(rgba(0, 0, 0, 0.75) 50%, transparent 51%);
      background-size: 4px 4px;
      pointer-events: none;
      border-radius: 8px;
    }

    /* Top Section: Logo + Main Text */
    .top-row {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
    }

    /* Big Left Airline Logo Box */
    .logo-box {
      width: 110px;
      height: 110px;
      background: #050505;
      border: 2px solid #0055ff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .logo-box img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px #0055ff);
    }

    .main-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
    }

    .airline-name {
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 0 0 8px #ffffff;
    }

    .route {
      font-size: 2rem;
      color: #0088ff;
      text-shadow: 0 0 8px #0088ff;
    }

    .aircraft {
      font-size: 1.8rem;
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
    }

    /* Bottom Section: Telemetry Lines */
    .telemetry {
      font-size: 1.6rem;
      color: #00e5ff;
      text-shadow: 0 0 6px #00e5ff;
      border-top: 1px dashed #222;
      padding-top: 15px;
      line-height: 1.4;
    }

    .status-bar {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #444;
      text-align: right;
    }

    button {
      background: #00ff66;
      color: #000;
      border: none;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      padding: 6px 16px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
    button:hover { background: #00cc55; }
  </style>
</head>
<body>

  <div class="led-board">
    <div class="top-row">
      <div class="logo-box">
        <img id="logo" src="https://flightaware.com/images/airline_logos/90px/UNK.png" alt="Logo">
      </div>
      <div class="main-info">
        <div class="airline-name" id="airline">SCANNING...</div>
        <div class="route" id="callsign">----</div>
        <div class="aircraft" id="icao">ICAO: ----</div>
      </div>
    </div>

    <div class="telemetry">
      <div>Alt:<span id="alt">--</span>ft, Spd:<span id="speed">--</span>mph</div>
      <div>Dist:<span id="dist">--</span>km, Track:<span id="track">--</span>deg</div>
    </div>

    <button onclick="initScan()">RE-SCAN OVERHEAD</button>
    <div class="status-bar" id="status">INITIALIZING...</div>
  </div>

  <script>
    async function initScan() {
      document.getElementById('status').innerText = "LOCATING IP...";
      try {
        // Fast location lookup by IP address to bypass browser hang/permissions
        const ipRes = await fetch('https://ipapi.co/json/');
        const ipData = await ipRes.json();
        
        if (ipData.latitude && ipData.longitude) {
          fetchNearestFlight(ipData.latitude, ipData.longitude);
        } else {
          // Default fallback (Frankfurt airspace)
          fetchNearestFlight(50.1109, 8.6821);
        }
      } catch (e) {
        fetchNearestFlight(50.1109, 8.6821);
      }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchNearestFlight(lat, lon) {
      document.getElementById('status').innerText = "FETCHING ADS-B DATA...";
      const delta = 2.0;
      const targetUrl = `https://opensky-network.org/api/states/all?lamin=${lat - delta}&lamax=${lat + delta}&lomin=${lon - delta}&lomax=${lon + delta}`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const data = await res.json();

        if (!data.states || data.states.length === 0) {
          document.getElementById('airline').innerText = "NO TARGETS";
          document.getElementById('status').innerText = "CLEAR SKY";
          return;
        }

        let nearest = null;
        let minDist = Infinity;

        data.states.forEach(plane => {
          if (plane[6] && plane[5]) {
            const d = getDistance(lat, lon, plane[6], plane[5]);
            if (d < minDist) {
              minDist = d;
              nearest = plane;
            }
          }
        });

        if (nearest) {
          const callsign = (nearest[1] || "UNK").trim();
          const icao = nearest[0].toUpperCase();
          const altFt = Math.round((nearest[7] || 0) * 3.28084);
          const spdMph = Math.round((nearest[9] || 0) * 2.23694);
          const track = Math.round(nearest[10] || 0);

          // Extract 3-letter ICAO code for airline logo lookup
          const airlineIcao = callsign.substring(0, 3);

          document.getElementById('airline').innerText = callsign.length > 3 ? airlineIcao + " FLIGHT" : "AIRCRAFT";
          document.getElementById('callsign').innerText = callsign;
          document.getElementById('icao').innerText = "ICAO: " + icao;
          document.getElementById('alt').innerText = altFt.toLocaleString();
          document.getElementById('speed').innerText = spdMph;
          document.getElementById('dist').innerText = minDist.toFixed(1);
          document.getElementById('track').innerText = track;
          
          // Pull logo directly from FlightAware assets
          document.getElementById('logo').src = `https://flightaware.com/images/airline_logos/90px/${airlineIcao}.png`;
          document.getElementById('status').innerText = "SYSTEM LIVE";
        }
      } catch (err) {
        document.getElementById('status').innerText = "DATA RETRY NEEDED";
      }
    }

    // Run automatically on page load
    initScan();
  </script>
</body>
</html>
