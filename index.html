<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Aircraft Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030303;
      font-family: 'VT323', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* LED Board Container */
    .led-frame {
      background: #000;
      border: 6px solid #111;
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 0 40px rgba(0, 102, 255, 0.2);
      position: relative;
    }

    /* Dot Matrix Overlay Effect */
    .led-frame::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(rgba(0, 0, 0, 0.7) 40%, transparent 41%);
      background-size: 3px 3px;
      pointer-events: none;
      border-radius: 6px;
    }

    /* Top Grid Layout */
    .top-panel {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    /* Pixel Art Logo Canvas */
    #logoCanvas {
      width: 100px;
      height: 100px;
      background: #000;
      border: 2px solid #0055ff;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 85, 255, 0.5);
    }

    /* Right Side Text Layout */
    .flight-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .airline {
      font-size: 2.2rem;
      color: #0088ff;
      text-shadow: 0 0 8px #0088ff;
      letter-spacing: 1px;
    }

    .callsign {
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
      line-height: 0.9;
    }

    .aircraft {
      font-size: 1.8rem;
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
    }

    /* Bottom Lines */
    .telemetry-row {
      font-size: 1.8rem;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff;
      border-top: 1px solid #111;
      padding-top: 8px;
    }

    .btn-scan {
      margin-top: 15px;
      background: #0055ff;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      border: none;
      padding: 8px;
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-scan:hover { background: #0044cc; }

    .status {
      font-size: 1.1rem;
      color: #333;
      text-align: right;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="led-frame">
    <div class="top-panel">
      <canvas id="logoCanvas" width="100" height="100"></canvas>
      <div class="flight-info">
        <div class="airline" id="airline">SCANNING...</div>
        <div class="callsign" id="callsign">----</div>
        <div class="aircraft" id="aircraft">----</div>
      </div>
    </div>

    <div class="telemetry-row">
      Alt:<span id="alt">--</span>ft,Spd:<span id="speed">--</span>mph
    </div>
    <div class="telemetry-row">
      Trk:<span id="track">--</span>deg,Dist:<span id="dist">--</span>km
    </div>

    <button class="btn-scan" onclick="fetchFlightData()">SCAN AIRSPACE</button>
    <div class="status" id="status">INIT</div>
  </div>

  <script>
    // -------------------------------------------------------------
    // INPUT YOUR LATITUDE AND LONGITUDE HERE (e.g. from Google Maps)
    // -------------------------------------------------------------
    const MY_LAT = 50.1096; 
    const MY_LON = 18.9572;

    function drawLedLogo() {
      const canvas = document.getElementById('logoCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 100, 100);

      ctx.fillStyle = '#0055ff';
      ctx.shadowColor = '#0055ff';
      ctx.shadowBlur = 8;

      // Draw Globe / Grid Pattern
      for(let y = 15; y < 85; y += 8) {
        for(let x = 15; x < 85; x += 8) {
          if (Math.hypot(x - 50, y - 50) < 35) {
            ctx.beginPath();
            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Overlay Aircraft Wings
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(50, 30);
      ctx.lineTo(65, 70);
      ctx.lineTo(50, 60);
      ctx.lineTo(35, 70);
      ctx.closePath();
      ctx.fill();
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchFlightData() {
      document.getElementById('status').innerText = "FETCHING ADS-B...";
      drawLedLogo();

      try {
        // Direct query to adsb.lol with exact radius (in km) around your coordinates
        const apiRes = await fetch(`https://api.adsb.lol/v2/lat/${MY_LAT}/lon/${MY_LON}/dist/150`);
        const data = await apiRes.json();

        if (!data.ac || data.ac.length === 0) {
          document.getElementById('airline').innerText = "NO TARGETS";
          document.getElementById('callsign').innerText = "NONE";
          document.getElementById('status').innerText = "CLEAR SKY";
          return;
        }

        let nearest = null;
        let minDist = Infinity;

        data.ac.forEach(plane => {
          if (plane.lat && plane.lon) {
            const d = getDistance(MY_LAT, MY_LON, plane.lat, plane.lon);
            if (d < minDist) {
              minDist = d;
              nearest = plane;
            }
          }
        });

        if (nearest) {
          const callsign = (nearest.flight || "UNKNOWN").trim();
          const altFt = nearest.alt_baro || nearest.alt_geom || 0;
          const spdMph = Math.round((nearest.gs || 0) * 1.15078);
          const track = Math.round(nearest.track || 0);
          const type = nearest.t || "AIRCRAFT";

          document.getElementById('airline').innerText = callsign.slice(0, 3) + " AIR";
          document.getElementById('callsign').innerText = callsign;
          document.getElementById('aircraft').innerText = type;
          document.getElementById('alt').innerText = (altFt/1000).toFixed(1) + "k";
          document.getElementById('speed').innerText = spdMph;
          document.getElementById('dist').innerText = minDist.toFixed(1);
          document.getElementById('track').innerText = track;
          document.getElementById('status').innerText = "LIVE DATA";
        }
      } catch (err) {
        document.getElementById('status').innerText = "RETRYING...";
      }
    }

    // Auto load on start
    fetchFlightData();
  </script>
</body>
</html>
