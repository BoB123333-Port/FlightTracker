<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Aircraft Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030303;
      font-family: 'VT323', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .led-frame {
      background: #000;
      border: 6px solid #111;
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 0 40px rgba(0, 102, 255, 0.2);
      position: relative;
    }

    .led-frame::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(rgba(0, 0, 0, 0.7) 40%, transparent 41%);
      background-size: 3px 3px;
      pointer-events: none;
      border-radius: 6px;
    }

    .top-panel {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    #logoCanvas {
      width: 100px;
      height: 100px;
      background: #000;
      border: 2px solid #0055ff;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 85, 255, 0.5);
    }

    .flight-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .airline {
      font-size: 2.2rem;
      color: #0088ff;
      text-shadow: 0 0 8px #0088ff;
      letter-spacing: 1px;
    }

    .callsign {
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
      line-height: 0.9;
    }

    .aircraft {
      font-size: 1.8rem;
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
    }

    .telemetry-row {
      font-size: 1.8rem;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff;
      border-top: 1px solid #111;
      padding-top: 8px;
    }

    .debug-console {
      margin-top: 15px;
      background: #080808;
      border: 1px dashed #0055ff;
      padding: 10px;
      font-size: 1.1rem;
      color: #ff3333;
      height: 110px;
      overflow-y: auto;
      border-radius: 4px;
      line-height: 1.2;
    }

    .debug-line { margin-bottom: 3px; }
    .debug-info { color: #00e5ff; }
    .debug-success { color: #00ff66; }
    .debug-err { color: #ff3333; }

    .btn-scan {
      margin-top: 15px;
      background: #0055ff;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      border: none;
      padding: 8px;
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-scan:hover { background: #0044cc; }

    .status {
      font-size: 1.1rem;
      color: #888;
      text-align: right;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="led-frame">
    <div class="top-panel">
      <canvas id="logoCanvas" width="100" height="100"></canvas>
      <div class="flight-info">
        <div class="airline" id="airline">SCANNING...</div>
        <div class="callsign" id="callsign">----</div>
        <div class="aircraft" id="aircraft">----</div>
      </div>
    </div>

    <div class="telemetry-row">
      Alt:<span id="alt">--</span>ft,Spd:<span id="speed">--</span>mph
    </div>
    <div class="telemetry-row">
      Trk:<span id="track">--</span>deg,Dist:<span id="dist">--</span>nm
    </div>

    <div class="debug-console" id="debugConsole">
      <div class="debug-line debug-info">[SYS] Debug Console Ready...</div>
    </div>

    <button class="btn-scan" onclick="fetchFlightData()">SCAN AIRSPACE</button>
    <div class="status" id="status">INIT</div>
  </div>

  <script>
    const MY_LAT = 50.0125; 
    const MY_LON = 18.9884;

    function logDebug(msg, type = 'info') {
      const consoleEl = document.getElementById('debugConsole');
      const time = new Date().toISOString().split('T')[1].slice(0,8);
      const line = document.createElement('div');
      line.className = `debug-line debug-${type}`;
      line.innerText = `[${time}] ${msg}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function drawLedLogo() {
      const canvas = document.getElementById('logoCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 100, 100);

      ctx.fillStyle = '#0055ff';
      ctx.shadowColor = '#0055ff';
      ctx.shadowBlur = 8;

      for(let y = 15; y < 85; y += 8) {
        for(let x = 15; x < 85; x += 8) {
          if (Math.hypot(x - 50, y - 50) < 35) {
            ctx.beginPath();
            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(50, 30);
      ctx.lineTo(65, 70);
      ctx.lineTo(50, 60);
      ctx.lineTo(35, 70);
      ctx.closePath();
      ctx.fill();
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchFlightData() {
      document.getElementById('status').innerText = "FETCHING OPENSKY...";
      logDebug(`INIT SCAN @ LAT: ${MY_LAT}, LON: ${MY_LON}`, 'info');
      drawLedLogo();

      const lamin = MY_LAT - 0.8, lamax = MY_LAT + 0.8;
      const lomin = MY_LON - 0.8, lomax = MY_LON + 0.8;
      const apiUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;

      try {
        logDebug("Connecting directly to OpenSky...", "info");
        const res = await fetch(apiUrl);
        
        logDebug(`HTTP Status: ${res.status}`, res.ok ? 'success' : 'err');
        if (!res.ok) throw new Error(`HTTP_${res.status}`);

        const data = await res.json();
        
        if (!data.states || data.states.length === 0) {
          logDebug("0 Aircraft found overhead", "err");
          document.getElementById('airline').innerText = "NO TARGETS";
          document.getElementById('callsign').innerText = "NONE";
          document.getElementById('aircraft').innerText = "----";
          document.getElementById('status').innerText = "CLEAR SKY";
          return;
        }

        const planes = data.states.map(s => {
          const lat = s[6], lon = s[5];
          const dist = (lat && lon) ? getDistance(MY_LAT, MY_LON, lat, lon) : 999;
          return {
            callsign: (s[1] || "UNKNOWN").trim(),
            altMeters: s[7] || s[13] || 0,
            velocityMps: s[9] || 0,
            track: Math.round(s[10] || 0),
            distNm: dist
          };
        }).sort((a, b) => a.distNm - b.distNm);

        const nearest = planes[0];
        logDebug(`Target Acquired: ${nearest.callsign || 'UNKNOWN'}`, "success");

        const callsign = nearest.callsign || "UNKNOWN";
        const altFt = Math.round(nearest.altMeters * 3.28084);
        const spdMph = Math.round(nearest.velocityMps * 2.23694);

        document.getElementById('airline').innerText = callsign.length >= 3 ? callsign.slice(0, 3) + " AIR" : "AIRCRAFT";
        document.getElementById('callsign').innerText = callsign;
        document.getElementById('aircraft').innerText = "ADS-B";
        document.getElementById('alt').innerText = (altFt / 1000).toFixed(1) + "k";
        document.getElementById('speed').innerText = spdMph;
        document.getElementById('dist').innerText = nearest.distNm.toFixed(1);
        document.getElementById('track').innerText = nearest.track;
        document.getElementById('status').innerText = "LIVE DATA";

      } catch (err) {
        logDebug(`ERR: ${err.message}`, "err");
        document.getElementById('status').innerText = "ERROR";
      }
    }

    fetchFlightData();
  </script>
</body>
</html>
